<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>درب العراق | Darb Al-Iraq</title>
<link rel="preconnect" href="https://unpkg.com">
<link rel="preconnect" href="https://tile.openstreetmap.org">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#08111f;--panel:rgba(12,23,43,.96);--line:#35466b;--blue:#526ff5;--muted:#b5c3dc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;margin:0}
body{background:var(--bg);color:#fff;font-family:Tajawal,Arial,sans-serif;overflow:hidden}
#map{position:fixed;inset:0;width:100%;height:100%;height:100dvh;background:#dce5e8;z-index:0;direction:ltr}
.panel{position:absolute;z-index:500;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 30px #0005}
.top{top:10px;left:10px;right:10px;padding:12px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.brand h2{margin:0;font-size:22px;color:#8ba7ff}
.brand small{color:var(--muted);font-size:12px}
.search{display:flex;gap:7px}
input{min-width:0;flex:1;background:#101d34;color:white;border:1px solid #34486e;border-radius:12px;padding:12px;font:inherit;outline:none}
button{border:0;border-radius:12px;padding:10px 13px;background:var(--blue);color:white;font:inherit;font-weight:700;cursor:pointer}
button:active{transform:scale(.98)}
button.ghost{background:#1c2c4d;border:1px solid #3a4d78}
button.danger{background:#e04b5a}
.results{display:none;margin-top:8px;max-height:220px;overflow:auto}
.result{padding:10px 7px;border-bottom:1px solid #30405c;cursor:pointer;font-size:14px;line-height:1.5}
.result:hover{background:#243657}
#message{font-size:13px;color:#ffda88;margin-top:8px;line-height:1.5}
#message:empty{display:none}
.actions{position:absolute;z-index:500;right:10px;top:42%;display:flex;flex-direction:column;gap:8px}
.actions button{width:46px;height:46px;padding:0;font-size:19px;box-shadow:0 4px 14px #0006}
.bottom{bottom:10px;left:10px;right:10px;padding:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.status{color:var(--muted);font-size:13px;margin-top:5px;line-height:1.5;overflow-wrap:anywhere}
.btns{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.footer{font-size:12px;color:#c0cce2;text-align:center;margin-top:9px;line-height:1.7}
.footer a{color:#9bb1ff;text-decoration:none}
.leaflet-control-attribution{font-size:10px}
.leaflet-popup-content{font-family:Tajawal,Arial,sans-serif;text-align:right;direction:rtl}
.report-list{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.report-list button{background:#1c2c4d;border:1px solid #3a4d78;padding:10px 3px;font-size:13px}
.report-list span{display:block;font-size:21px;margin-bottom:4px}
.leaflet-container{font-family:Tajawal,Arial,sans-serif}
@media(min-width:700px){
 .top{left:20px;right:auto;width:430px}
 .bottom{left:20px;right:auto;width:430px}
 .actions{right:22px}
}
@media(max-height:650px){
 .top{padding:9px}.brand{margin-bottom:6px}.brand h2{font-size:19px}
 .bottom{padding:9px}.footer{margin-top:5px}
 .actions{top:44%}
}
</style>
</head>
<body>
<div id="map" aria-label="خريطة درب العراق"></div>

<div class="panel top">
  <div class="brand">
    <div>
      <h2>درب العراق <small>DARB AL-IRAQ</small></h2>
      <small>ملاحتك بلمسة عراقية 🇮🇶</small>
    </div>
    <button class="ghost" id="homeBtn" type="button">بغداد</button>
  </div>
  <div class="search">
    <input id="searchInput" placeholder="ابحث عن مكان أو شارع بأي دولة..." autocomplete="off">
    <button id="searchBtn" type="button">بحث</button>
  </div>
  <div id="results" class="results"></div>
  <div id="message" role="status"></div>
</div>

<div class="actions">
  <button id="locateBtn" title="موقعي" aria-label="موقعي">◎</button>
  <button id="zoomInBtn" title="تكبير">＋</button>
  <button id="zoomOutBtn" title="تصغير">−</button>
  <button id="reportBtn" title="إضافة بلاغ">🚨</button>
</div>

<div class="panel bottom">
  <div class="row">
    <div style="min-width:0;flex:1">
      <strong id="destinationTitle">درب العراق إلى وجهتك</strong>
      <div class="status" id="routeInfo">ابحث عن مكان وحدده، ثم احسب المسار.</div>
    </div>
    <div class="btns">
      <button id="routeBtn" type="button">عرض المسار</button>
      <button id="clearBtn" class="ghost" type="button">مسح</button>
    </div>
  </div>
  <div class="report-list" id="reportList" hidden>
    <button data-type="checkpoint"><span>🚧</span>سيطرة</button>
    <button data-type="traffic"><span>🚗</span>زحمة</button>
    <button data-type="pothole"><span>🕳️</span>حفرة</button>
    <button data-type="bump"><span>⚠️</span>مطب</button>
    <button data-type="accident"><span>💥</span>حادث</button>
    <button data-type="camera"><span>📷</span>كاميرا</button>
  </div>
  <div class="footer">تمت البرمجة بأيادٍ عراقية 🇮🇶<br>المطوّر: <a href="https://www.instagram.com/uv_d0/" target="_blank" rel="noopener noreferrer">@uv_d0</a></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const say = text => { $('message').textContent = text || ''; };
const BAGHDAD = [33.3152, 44.3661];
let map, userMarker = null, destinationMarker = null, routeLayer = null;
let userPosition = null, destination = null, routeBusy = false;
let reportMarkers = [];

const types = {
 checkpoint:{icon:'🚧',label:'سيطرة'},
 traffic:{icon:'🚗',label:'ازدحام'},
 pothole:{icon:'🕳️',label:'حفرة'},
 bump:{icon:'⚠️',label:'مطب'},
 accident:{icon:'💥',label:'حادث'},
 camera:{icon:'📷',label:'كاميرا'}
};

function initMap(){
  if(typeof L === 'undefined'){
    say('تعذّر تحميل مكتبة الخريطة. تأكد من الإنترنت ثم حدّث الصفحة.');
    return;
  }
  try{
    map = L.map('map', {zoomControl:false, preferCanvas:true}).setView(BAGHDAD, 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom:19,
      attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>',
      crossOrigin:true
    }).addTo(map);
    map.on('tileerror', () => {
      say('بعض أجزاء الخريطة ما تحمّلت. تحقق من الاتصال أو جرّب تحديث الصفحة.');
    });
    map.whenReady(() => {
      setTimeout(() => map.invalidateSize(true), 250);
      say('الخريطة جاهزة. ابحث عن وجهتك.');
    });
    window.addEventListener('resize', () => map.invalidateSize(true));
    setTimeout(() => { if(map) map.invalidateSize(true); }, 1000);
  }catch(err){
    console.error(err);
    say('تعذّر تشغيل الخريطة في هذا المتصفح. جرّب Chrome وتأكد من تفعيل تسريع الرسوميات.');
  }
}

function distanceMeters(a,b){
  return map.distance(L.latLng(a[0],a[1]), L.latLng(b[0],b[1]));
}
function setUser(latlng){
  userPosition = [latlng.lat, latlng.lng];
  if(!userMarker){
    userMarker = L.circleMarker(latlng,{radius:8,color:'#fff',weight:3,fillColor:'#22d3a6',fillOpacity:1})
      .addTo(map).bindPopup('موقعك الحالي');
  }else userMarker.setLatLng(latlng);
}
function locateUser(){
  if(!navigator.geolocation){
    say('المتصفح لا يدعم تحديد الموقع.');
    return;
  }
  say('جاري تحديد موقعك...');
  navigator.geolocation.getCurrentPosition(pos => {
    const ll = L.latLng(pos.coords.latitude, pos.coords.longitude);
    setUser(ll);
    map.flyTo(ll,16);
    say('تم تحديد موقعك.');
  }, err => {
    console.warn(err);
    say(location.protocol === 'file:' ?
      'الموقع الجغرافي قد لا يعمل من ملف مباشر. افتح الموقع عبر HTTPS أو localhost.' :
      'تعذّر تحديد الموقع. اسمح للمتصفح باستخدام الموقع وتأكد من تشغيل GPS.');
  }, {enableHighAccuracy:true, timeout:15000, maximumAge:5000});
}

async function searchPlaces(){
  const q = $('searchInput').value.trim();
  if(!q){ say('اكتب اسم المكان أولاً.'); return; }
  $('results').style.display = 'block';
  $('results').innerHTML = '<div class="result">جاري البحث...</div>';
  say('');
  try{
    const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=8&addressdetails=1&accept-language=ar,en&q=' + encodeURIComponent(q);
    const response = await fetch(url, {headers:{'Accept':'application/json'}});
    if(!response.ok) throw new Error('Search HTTP ' + response.status);
    const places = await response.json();
    const box = $('results');
    box.innerHTML = '';
    if(!places.length){
      box.innerHTML = '<div class="result">ما لقينا نتيجة. جرّب كتابة الاسم بالعربي أو الإنكليزي.</div>';
      return;
    }
    places.forEach(place => {
      const item = document.createElement('div');
      item.className = 'result';
      item.textContent = place.display_name;
      item.addEventListener('click', () => selectPlace(place));
      box.appendChild(item);
    });
  }catch(err){
    console.error(err);
    $('results').innerHTML = '<div class="result">تعذّر البحث. تحقق من الإنترنت وحاول بعد قليل.</div>';
  }
}
function selectPlace(place){
  const lat = Number(place.lat), lon = Number(place.lon);
  if(!Number.isFinite(lat) || !Number.isFinite(lon)) return;
  destination = [lat,lon];
  $('destinationTitle').textContent = (place.name || place.display_name.split(',')[0] || 'الوجهة المحددة');
  $('routeInfo').textContent = place.display_name;
  $('results').style.display = 'none';
  if(destinationMarker) map.removeLayer(destinationMarker);
  destinationMarker = L.marker(destination).addTo(map).bindPopup(place.display_name).openPopup();
  map.flyTo(destination,15);
  say('تم تحديد الوجهة. اضغط «عرض المسار».');
  clearRoute(false);
}

async function showRoute(){
  if(routeBusy) return;
  if(!destination){ say('ابحث عن وجهتك واختارها أولاً.'); return; }
  if(!userPosition){
    if(!navigator.geolocation){
      say('المتصفح لا يدعم تحديد الموقع.'); return;
    }
    say('نحتاج موقعك حتى نحسب المسار...');
    try{
      const p = await new Promise((resolve,reject) => navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:true,timeout:15000}));
      setUser(L.latLng(p.coords.latitude,p.coords.longitude));
    }catch(e){
      say('تعذّر تحديد موقعك. اسمح بإذن الموقع، أو اضغط «موقعي» أولاً.');
      return;
    }
  }
  routeBusy = true;
  $('routeBtn').disabled = true;
  say('جاري حساب المسار...');
  try{
    const start = [userPosition[1],userPosition[0]];
    const end = [destination[1],destination[0]];
    const url = `https://router.project-osrm.org/route/v1/driving/${start[0]},${start[1]};${end[0]},${end[1]}?overview=full&geometries=geojson`;
    const response = await fetch(url);
    if(!response.ok) throw new Error('Route HTTP ' + response.status);
    const data = await response.json();
    if(data.code !== 'Ok' || !data.routes || !data.routes.length) throw new Error('No route');
    const route = data.routes[0];
    clearRoute(false);
    const latlngs = route.geometry.coordinates.map(c => [c[1],c[0]]);
    const casing = L.polyline(latlngs,{color:'#142b68',weight:9,opacity:.85});
    const topLine = L.polyline(latlngs,{color:'#587cff',weight:5,opacity:1});
    routeLayer = L.layerGroup([casing, topLine]).addTo(map);
    const km = route.distance / 1000;
    const mins = Math.max(1,Math.round(route.duration/60));
    $('routeInfo').textContent = `المسافة ${km.toFixed(1)} كم · الوقت التقريبي ${mins} دقيقة`;
    $('routeBtn').textContent = 'تحديث المسار';
    map.fitBounds(L.latLngBounds(latlngs),{paddingTopLeft:[30,170],paddingBottomRight:[30,210],maxZoom:16});
    say('تم رسم المسار. الوقت والمسافة تقديريّان.');
  }catch(err){
    console.error(err);
    say('تعذّر حساب المسار حالياً. تحقق من الإنترنت أو جرّب وجهة أقرب.');
  }finally{
    routeBusy = false;
    $('routeBtn').disabled = false;
  }
}
function clearRoute(showMessage=true){
  if(routeLayer && map){ map.removeLayer(routeLayer); routeLayer = null; }
  if(showMessage){
    $('routeInfo').textContent = 'تم مسح المسار. ابحث عن وجهة جديدة.';
    say('');
  }
}
function toggleReports(){
  const list = $('reportList');
  list.hidden = !list.hidden;
  if(!list.hidden) say('اختار نوع البلاغ، وسيُضاف عند موقعك الحالي أو مركز الخريطة.');
}
function addReport(type){
  const t = types[type];
  if(!t || !map) return;
  const ll = userPosition ? L.latLng(userPosition[0],userPosition[1]) : map.getCenter();
  const marker = L.marker(ll).addTo(map).bindPopup(`${t.icon} ${t.label}<br>بلاغ محلي على هذا الجهاز`);
  reportMarkers.push(marker);
  $('reportList').hidden = true;
  say(`تم وضع علامة بلاغ «${t.label}» على الخريطة بهذا الجهاز.`);
}

$('searchBtn').addEventListener('click',searchPlaces);
$('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter') searchPlaces();});
$('locateBtn').addEventListener('click',locateUser);
$('zoomInBtn').addEventListener('click',()=>map && map.zoomIn());
$('zoomOutBtn').addEventListener('click',()=>map && map.zoomOut());
$('homeBtn').addEventListener('click',()=>{if(map) map.flyTo(BAGHDAD,12);});
$('routeBtn').addEventListener('click',showRoute);
$('clearBtn').addEventListener('click',()=>{
  clearRoute(false);
  destination = null;
  if(destinationMarker){map.removeLayer(destinationMarker);destinationMarker=null;}
  $('destinationTitle').textContent = 'درب العراق إلى وجهتك';
  $('routeInfo').textContent = 'ابحث عن مكان وحدده، ثم احسب المسار.';
  $('routeBtn').textContent = 'عرض المسار';
  say('تم مسح الوجهة والمسار.');
});
$('reportBtn').addEventListener('click',toggleReports);
$('reportList').querySelectorAll('button[data-type]').forEach(btn=>{
  btn.addEventListener('click',()=>addReport(btn.dataset.type));
});
window.addEventListener('online',()=>say('عاد الاتصال بالإنترنت. حدّث الصفحة إذا بقيت الخريطة فارغة.'));
window.addEventListener('offline',()=>say('الاتصال بالإنترنت منقطع. الخريطة والبحث يحتاجان إلى الإنترنت.'));
initMap();
})();
</script>
</body>
</html>
