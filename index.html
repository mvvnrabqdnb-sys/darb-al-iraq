<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>درب العراق | Darb Al-Iraq Navigation</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#08111f;color:#fff;font-family:Tajawal,Arial,sans-serif;overflow:hidden}
#map{position:absolute;inset:0;direction:ltr}
.maplibregl-ctrl-bottom-left{margin-bottom:140px}
body.navigating .maplibregl-ctrl-bottom-left{display:none}

.panel{position:absolute;z-index:5;background:rgba(12,23,43,.95);
border:1px solid #35466b;border-radius:18px;box-shadow:0 8px 30px #0005}
.top{top:12px;left:12px;right:12px;padding:12px}
.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.brand h2{margin:0;font-size:23px;color:#8ba7ff}
.brand small{color:#b5c3dc}
.search{display:flex;gap:8px}
input{min-width:0;flex:1;background:#101d34;color:white;border:1px solid #34486e;
border-radius:12px;padding:13px;font:inherit;outline:none}
button{border:0;border-radius:12px;padding:11px 14px;background:#526ff5;color:white;
font:inherit;font-weight:700;cursor:pointer}
button:active{transform:scale(.97)}
button.ghost{background:#1c2c4d;border:1px solid #3a4d78}
button.danger{background:#e04b5a}
.results{display:none;margin-top:8px;max-height:260px;overflow:auto}
.result{padding:10px 8px;border-bottom:1px solid #30405c;cursor:pointer;display:flex;gap:10px;align-items:center}
.result:hover{background:#243657}
.result .rt{flex:1;min-width:0}
.result .rn{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result .ra{font-size:12px;color:#aebfe0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result .rd{font-size:12px;background:#243a66;border-radius:10px;padding:4px 8px;white-space:nowrap;color:#cfe0ff}
#message{font-size:13px;color:#ffda88;margin-top:8px;min-height:0}
#message:empty{display:none}

.actions{position:absolute;z-index:5;right:12px;top:40%;display:flex;flex-direction:column;gap:10px}
.actions button{width:48px;height:48px;padding:0;font-size:20px;box-shadow:0 4px 14px #0006}
.actions .report{background:#ff7a3d}

.bottom{bottom:12px;left:12px;right:12px;padding:14px}
.status{color:#aebfe0;font-size:13px;margin-top:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btns{display:flex;flex-direction:column;gap:6px}
.footer{font-size:12px;color:#c0cce2;text-align:center;margin-top:10px}
.footer a{color:#9bb1ff;text-decoration:none}

/* navigation mode */
.only-nav{display:none}
body.navigating .only-nav{display:flex}
body.navigating .not-nav{display:none !important}
.navbanner{top:12px;left:12px;right:12px;padding:12px 16px;align-items:center;gap:14px;background:#1a6b3c;border-color:#2fa162}
#navArrow{font-size:42px;line-height:1;min-width:48px;text-align:center}
#navDist{font-size:26px;font-weight:800}
#navText{font-size:15px;opacity:.95}
.speedbox{position:absolute;z-index:5;left:12px;bottom:112px;flex-direction:column;gap:10px;align-items:center}
.limit{width:56px;height:56px;border-radius:50%;background:#fff;color:#111;border:5px solid #e03a3a;
display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
.limit.none{opacity:.45;font-size:14px}
.speed{width:66px;height:66px;border-radius:50%;background:rgba(12,23,43,.95);border:3px solid #6587ff;
display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.speed b{font-size:24px}
.speed small{font-size:10px;color:#aebfe0;margin-top:2px}
.speed.over{border-color:#ff4d4d;background:#5a1620}
.navbar{bottom:12px;left:12px;right:12px;padding:12px 14px;align-items:center;justify-content:space-between;gap:8px}
.stat{text-align:center;flex:1}
.stat b{display:block;font-size:20px}
.stat span{font-size:11px;color:#aebfe0}
.navbar button{padding:10px 14px}

.alert{left:12px;right:12px;top:100px;padding:12px;display:none;align-items:center;gap:10px;background:#4a2b0f;border-color:#ff9a4d;z-index:8}
.alert.show{display:flex}
.alert .ai{font-size:30px}
.alert .at{flex:1;font-weight:700}
.alert button{padding:8px 10px;font-size:13px}

.sheet{left:12px;right:12px;bottom:12px;padding:14px;display:none;z-index:9}
.sheet.show{display:block}
.sheet h3{margin:0 0 10px;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid button{background:#1c2c4d;border:1px solid #3a4d78;padding:14px 6px;font-size:14px;display:flex;flex-direction:column;gap:6px;align-items:center}
.grid button span{font-size:28px}

.hz{font-size:24px;line-height:1;filter:drop-shadow(0 2px 3px #000a);cursor:pointer}
.me{width:24px;height:24px;border-radius:50%;background:#38e8ad;border:3px solid #fff;box-shadow:0 0 0 7px #38e8ad44;position:relative}
.me::after{content:'';position:absolute;top:-13px;left:50%;transform:translateX(-50%);
border:7px solid transparent;border-bottom:11px solid #fff;border-top:0}
.pop{direction:rtl;font-family:Tajawal,Arial,sans-serif;color:#111;min-width:170px}
.pop b{font-size:15px}
.pop .pm{font-size:12px;color:#555;margin:4px 0 8px}
.pop .pb{display:flex;gap:6px}
.pop button{flex:1;padding:8px 6px;font-size:13px}
.maplibregl-popup-content{padding:12px 14px}

@media(min-width:700px){
 .top,.navbanner{left:20px;right:auto;width:430px}
 .bottom,.navbar{left:20px;right:auto;width:430px}
 .alert{left:20px;right:auto;width:430px}
 .sheet{left:20px;right:auto;width:430px}
 .actions{right:22px}
}
</style>
</head>

<body>
<div id="map"></div>

<!-- لوحة البحث -->
<div class="panel top not-nav">
  <div class="brand">
    <div>
      <h2>درب العراق <small>DARB AL-IRAQ</small></h2>
      <small>ملاحتك بلمسة عراقية 🇮🇶</small>
    </div>
    <button onclick="toggle3D()" id="viewButton">3D</button>
  </div>

  <div class="search">
    <input id="searchInput" placeholder="ابحث عن مكان أو شارع..." autocomplete="off">
    <button onclick="searchPlaces()">بحث</button>
  </div>
  <div id="results" class="results"></div>
  <div id="message"></div>
</div>

<!-- شريط التعليمات أثناء الملاحة -->
<div class="panel navbanner only-nav">
  <div id="navArrow">⬆</div>
  <div>
    <div id="navDist">--</div>
    <div id="navText">--</div>
  </div>
</div>

<!-- تنبيه سيطرة / كاميرا / حفرة قدامك -->
<div class="panel alert" id="alertBox">
  <div class="ai" id="alertIcon">🚧</div>
  <div class="at" id="alertText"></div>
  <button id="alertYes">موجود ✔</button>
  <button id="alertNo" class="danger">مو موجود ✖</button>
</div>

<!-- أزرار جانبية -->
<div class="actions">
  <button onclick="locateUser()" title="موقعي">◎</button>
  <button onclick="tiltMap()" title="منظور ثلاثي الأبعاد">3D</button>
  <button class="not-nav" onclick="resetMap()" title="بغداد">⌂</button>
  <button class="report" onclick="openReport()" title="تبليغ">🚨</button>
  <button id="muteBtn" class="ghost" onclick="toggleMute()" title="الصوت">🔊</button>
</div>

<!-- السرعة وحد السرعة -->
<div class="speedbox only-nav">
  <div class="limit none" id="limitBox">--</div>
  <div class="speed" id="speedBox"><b id="speedVal">0</b><small>كم/س</small></div>
</div>

<!-- لوحة الوجهة -->
<div class="panel bottom not-nav">
  <div class="row">
    <div style="min-width:0;flex:1">
      <strong id="destinationTitle">درب العراق إلى وجهتك</strong>
      <div class="status" id="routeInfo">ابحث عن مكان حتى تبدأ بتحديد وجهتك.</div>
    </div>
    <div class="btns">
      <button id="mainBtn" onclick="mainAction()">عرض المسار</button>
      <button class="ghost" onclick="simulateAction()" style="font-size:12px;padding:7px 10px">🎮 تجربة المسار</button>
    </div>
  </div>
  <div class="footer">
    تمت البرمجة بأيادٍ عراقية 🇮🇶<br>
    المطوّر: <a href="https://www.instagram.com/uv_d0/" target="_blank" rel="noopener">@uv_d0</a>
  </div>
</div>

<!-- شريط الملاحة السفلي -->
<div class="panel navbar only-nav">
  <div class="stat"><b id="etaClock">--</b><span>الوصول</span></div>
  <div class="stat"><b id="etaMin">--</b><span>دقيقة</span></div>
  <div class="stat"><b id="etaKm">--</b><span>كم</span></div>
  <button class="danger" onclick="stopNavigation(true)">إنهاء</button>
</div>

<!-- نافذة التبليغ -->
<div class="panel sheet" id="reportSheet">
  <h3>شنو تريد تبلّغ عنه هنا؟</h3>
  <div class="grid" id="reportGrid"></div>
  <button class="ghost" style="width:100%;margin-top:10px" onclick="closeReport()">إلغاء</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const $ = id => document.getElementById(id);
const message = text => $('message').textContent = text;

/* ---------- إصلاح الكتابة المعكوسة للعربي على الخريطة ---------- */
try{
  const p = maplibregl.setRTLTextPlugin(
    'https://cdn.jsdelivr.net/npm/@mapbox/mapbox-gl-rtl-text@0.2.3/mapbox-gl-rtl-text.min.js',
    true
  );
  if(p && p.catch) p.catch(e => console.log('RTL plugin failed:', e));
}catch(e){ console.log('RTL plugin error:', e); }

const map = new maplibregl.Map({
  container:'map',
  style:'https://tiles.openfreemap.org/styles/liberty',
  center:[44.3661,33.3152],
  zoom:12,
  pitch:55,
  bearing:-15,
  antialias:true
});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'bottom-left');

/* ---------- الحالة ---------- */
let userPosition = null;
let destination = null;
let destinationMarker = null;
let userMarker = null;
let is3D = true;
let routeReady = false;
let R = null;               // بيانات المسار الحالي
let navigating = false;
let watchId = null;
let simTimer = null;
let wakeLock = null;
let muted = false;
let ann = {};               // التعليمات الصوتية اللي انقالت
let alerted = new Set();    // تنبيهات الأخطار اللي انقالت بهاي الرحلة
let offCount = 0;
let rerouting = false;
let lastReroute = 0;
let lastFix = null;
let curLimit = null;
let lastLimitFetch = 0;
let lastOverWarn = 0;
let currentAlertReport = null;
let alertTimer = null;

/* ---------- أدوات رياضية ---------- */
const toR = Math.PI/180;
function hav(a,b){
  const dLat=(b[1]-a[1])*toR, dLng=(b[0]-a[0])*toR;
  const s=Math.sin(dLat/2)**2+Math.cos(a[1]*toR)*Math.cos(b[1]*toR)*Math.sin(dLng/2)**2;
  return 2*6371000*Math.asin(Math.sqrt(s));
}
function bearingBetween(a,b){
  const y=Math.sin((b[0]-a[0])*toR)*Math.cos(b[1]*toR);
  const x=Math.cos(a[1]*toR)*Math.sin(b[1]*toR)-Math.sin(a[1]*toR)*Math.cos(b[1]*toR)*Math.cos((b[0]-a[0])*toR);
  return (Math.atan2(y,x)/toR+360)%360;
}
function projectOnRoute(p){
  if(!R) return null;
  const k=Math.cos(p[1]*toR), Rm=6371000;
  const px=p[0]*toR*k*Rm, py=p[1]*toR*Rm;
  let best={dist:Infinity,along:0};
  const c=R.coords;
  for(let i=0;i<c.length-1;i++){
    const ax=c[i][0]*toR*k*Rm, ay=c[i][1]*toR*Rm;
    const bx=c[i+1][0]*toR*k*Rm, by=c[i+1][1]*toR*Rm;
    const dx=bx-ax, dy=by-ay, l2=dx*dx+dy*dy;
    let t=l2?((px-ax)*dx+(py-ay)*dy)/l2:0;
    t=Math.max(0,Math.min(1,t));
    const d=Math.hypot(px-(ax+t*dx),py-(ay+t*dy));
    if(d<best.dist) best={dist:d,along:R.cum[i]+t*(R.cum[i+1]-R.cum[i])};
  }
  return best;
}
function pointAtAlong(d){
  const c=R.coords, cum=R.cum;
  if(d<=0) return c[0];
  if(d>=cum[cum.length-1]) return c[c.length-1];
  let i=0; while(i<cum.length-2 && cum[i+1]<d) i++;
  const seg=cum[i+1]-cum[i]||1, t=(d-cum[i])/seg;
  return [c[i][0]+(c[i+1][0]-c[i][0])*t, c[i][1]+(c[i+1][1]-c[i][1])*t];
}
function fmtDist(m){
  return m<1000 ? (Math.max(10,Math.round(m/10)*10))+' م' : (m/1000).toFixed(1)+' كم';
}
function sayDist(m){
  if(m>=950) return 'كيلومتر واحد';
  return (Math.max(50,Math.round(m/50)*50))+' متر';
}

/* ---------- الصوت ---------- */
let arVoice = null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const v = speechSynthesis.getVoices();
  arVoice = v.find(x=>/^ar/i.test(x.lang)) || null;
}
if('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text){
  if(muted || !('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ar-SA';
    if(arVoice) u.voice = arVoice;
    u.rate = 1;
    speechSynthesis.speak(u);
  }catch(e){}
}
function toggleMute(){
  muted = !muted;
  $('muteBtn').textContent = muted ? '🔇' : '🔊';
  if(muted && 'speechSynthesis' in window) speechSynthesis.cancel();
}

/* ---------- الخريطة: تحميل + مباني 3D ---------- */
map.on('load',()=>{
  message('الخريطة جاهزة. ابحث عن وجهتك.');
  add3DBuildings();
  renderReports();
  loadCamerasInView();
});
map.on('moveend',()=>{
  clearTimeout(map._camT);
  map._camT=setTimeout(loadCamerasInView,1200);
});

function add3DBuildings(){
  try{
    const style = map.getStyle();
    if(!style.sources || !style.sources.openmaptiles) return;
    if(map.getLayer('darb-3d-buildings')) return;
    let labelLayerId;
    for(const layer of (style.layers||[])){
      if(layer.type==='symbol' && layer.layout && layer.layout['text-field']){ labelLayerId=layer.id; break; }
    }
    map.addLayer({
      id:'darb-3d-buildings',source:'openmaptiles','source-layer':'building',
      type:'fill-extrusion',minzoom:14,
      filter:['!=',['get','hide_3d'],'true'],
      paint:{
        'fill-extrusion-color':'#647ba5',
        'fill-extrusion-height':['interpolate',['linear'],['zoom'],14,0,15,['coalesce',['get','render_height'],['get','height'],12]],
        'fill-extrusion-base':['coalesce',['get','render_min_height'],0],
        'fill-extrusion-opacity':0.82
      }
    },labelLayerId);
  }catch(e){ console.log('3D buildings unavailable:',e); }
}

function toggle3D(){
  is3D=!is3D;
  map.easeTo({pitch:is3D?55:0,bearing:is3D?-15:0,duration:800});
  $('viewButton').textContent=is3D?'3D':'2D';
}
function tiltMap(){ is3D=true; map.easeTo({pitch:60,duration:800}); $('viewButton').textContent='3D'; }
function resetMap(){ map.flyTo({center:[44.3661,33.3152],zoom:12,pitch:55,bearing:-15}); }

/* ---------- علامة موقع المستخدم ---------- */
function setUserMarker(lnglat,heading){
  if(!userMarker){
    const el=document.createElement('div'); el.className='me';
    userMarker=new maplibregl.Marker({element:el,rotationAlignment:'map',pitchAlignment:'map'})
      .setLngLat(lnglat).addTo(map);
  }else userMarker.setLngLat(lnglat);
  if(heading!=null && !isNaN(heading)) userMarker.setRotation(heading);
}

/* ---------- البحث (نتائج قريبة منك أولاً) ---------- */
async function nominatim(q,extra){
  const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&accept-language=ar&countrycodes=iq&addressdetails=0&q='
    +encodeURIComponent(q)+(extra||'');
  const r=await fetch(url,{headers:{'Accept':'application/json'}});
  if(!r.ok) throw new Error('search failed');
  return r.json();
}
async function searchPlaces(){
  const q=$('searchInput').value.trim();
  if(!q){message('اكتب اسم المكان أولاً.');return;}
  const box=$('results');
  box.style.display='block';
  box.innerHTML='<div class="result">جاري البحث...</div>';
  message('');
  const c = userPosition || [map.getCenter().lng,map.getCenter().lat];
  const d=0.5;
  const vb='&viewbox='+[c[0]-d,c[1]+d,c[0]+d,c[1]-d].join(',');
  try{
    let list=await nominatim(q,vb+'&bounded=1');
    if(list.length<4){
      const more=await nominatim(q,vb);
      const seen=new Set(list.map(p=>p.place_id));
      more.forEach(p=>{ if(!seen.has(p.place_id)) list.push(p); });
    }
    list.forEach(p=>p._d=hav(c,[Number(p.lon),Number(p.lat)]));
    list.sort((a,b)=>a._d-b._d);
    box.innerHTML='';
    if(!list.length){
      box.innerHTML='<div class="result">ما لقينا نتائج. جرّب اسم أو عنوان أوضح.</div>';
      return;
    }
    list.slice(0,10).forEach(place=>{
      const parts=place.display_name.split('،').length>1?place.display_name.split('،'):place.display_name.split(',');
      const name=(place.name||parts[0]||'').trim();
      const addr=parts.slice(1,4).join('،').trim();
      const item=document.createElement('div'); item.className='result';
      const rt=document.createElement('div'); rt.className='rt';
      const rn=document.createElement('div'); rn.className='rn'; rn.textContent=name;
      const ra=document.createElement('div'); ra.className='ra'; ra.textContent=addr;
      rt.appendChild(rn); rt.appendChild(ra);
      const rd=document.createElement('div'); rd.className='rd'; rd.textContent=fmtDist(place._d);
      item.appendChild(rt); item.appendChild(rd);
      item.onclick=()=>selectPlace(place,name);
      box.appendChild(item);
    });
  }catch(e){
    box.innerHTML='<div class="result">تعذر البحث. تأكد من الإنترنت وحاول مرة ثانية.</div>';
  }
}
$('searchInput').addEventListener('keydown',e=>{ if(e.key==='Enter') searchPlaces(); });

function clearRoute(){
  routeReady=false; R=null;
  if(map.getLayer('darb-route')) map.removeLayer('darb-route');
  if(map.getLayer('darb-route-casing')) map.removeLayer('darb-route-casing');
  if(map.getSource('darb-route')) map.removeSource('darb-route');
  $('mainBtn').textContent='عرض المسار';
}
function selectPlace(place,name){
  clearRoute();
  destination=[Number(place.lon),Number(place.lat)];
  $('destinationTitle').textContent=name||'الوجهة المحددة';
  $('routeInfo').textContent=place.display_name;
  $('results').style.display='none';
  if(destinationMarker) destinationMarker.remove();
  destinationMarker=new maplibregl.Marker({color:'#ff5964'})
    .setLngLat(destination)
    .setPopup(new maplibregl.Popup().setText(place.display_name))
    .addTo(map);
  map.flyTo({center:destination,zoom:15,pitch:55,duration:1000});
  message('تم تحديد الوجهة. اضغط «عرض المسار».');
}

/* ---------- تحديد الموقع ---------- */
function getPosition(){
  return new Promise((res,rej)=>{
    if(!navigator.geolocation) return rej(new Error('unsupported'));
    navigator.geolocation.getCurrentPosition(
      p=>res([p.coords.longitude,p.coords.latitude]),
      e=>rej(e),
      {enableHighAccuracy:true,timeout:15000}
    );
  });
}
async function locateUser(){
  message('جاري تحديد موقعك...');
  try{
    userPosition=await getPosition();
    setUserMarker(userPosition);
    map.flyTo({center:userPosition,zoom:16,pitch:55});
    message('تم تحديد موقعك.');
  }catch(e){
    message('تعذر تحديد الموقع. اسمح للمتصفح بالوصول للموقع (لازم الموقع يكون HTTPS).');
  }
}

/* ---------- حساب المسار ---------- */
async function buildRoute(opts){
  opts=opts||{};
  const origin=opts.origin||userPosition;
  if(!origin||!destination) return false;
  if(!opts.silent) message('جاري حساب المسار...');
  try{
    const coords=origin.join(',')+';'+destination.join(',');
    const url='https://router.project-osrm.org/route/v1/driving/'+coords+'?overview=full&geometries=geojson&steps=true';
    const r=await fetch(url);
    if(!r.ok) throw new Error('route failed');
    const data=await r.json();
    if(data.code!=='Ok'||!data.routes.length) throw new Error('no route');
    const route=data.routes[0];
