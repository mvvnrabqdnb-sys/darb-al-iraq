
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>درب العراق | Darb Al-Iraq</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root{--bg:#091522;--panel:#101f31;--line:#253950;--cyan:#43ddc8;--blue:#2478ff;--text:#f4f8ff;--muted:#a4b5c8}
*{box-sizing:border-box}
html,body,#app,#map{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Tajawal,sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit}
button{cursor:pointer;border:0}
#map{position:absolute;inset:0;background:#dbe5eb}
.panel{position:absolute;z-index:5;background:#091522f2;border:1px solid #ffffff16;box-shadow:0 6px 24px #0002;border-radius:17px}
.top{top:10px;right:10px;left:10px;display:flex;gap:8px;align-items:center;padding:8px}
.brand{display:flex;align-items:center;gap:9px;min-width:150px}
.logo{background:linear-gradient(135deg,#43ddc8,#1584c5);color:#061b29;border-radius:12px;width:39px;height:39px;display:grid;place-items:center;font-size:24px;font-weight:900}
.brand b{font-size:16px;display:block}
.brand small{font-size:10px;color:var(--muted);direction:ltr;display:block}
.search{display:flex;gap:7px;flex:1;min-width:0}
.search input{min-width:0;width:100%;background:#17283c;border:1px solid #2a3e54;border-radius:12px;padding:11px;color:white;outline:0}
.btn{background:var(--cyan);color:#06212a;font-weight:900;border-radius:12px;padding:10px 14px;white-space:nowrap}
.iconbtn{width:43px;height:43px;border-radius:13px;background:#102137;color:white;font-size:20px;border:1px solid #2b3e52}
.tools{position:absolute;z-index:4;top:82px;left:10px;display:grid;gap:7px}
.status{top:82px;right:10px;padding:9px 12px;font-size:12px}
.route{top:125px;right:10px;width:min(300px,calc(100% - 20px));padding:14px;display:none}
.route.show{display:block}
.route h3{margin:0 0 10px}
.metrics{display:flex;gap:8px}
.metric{flex:1;background:#17283c;padding:10px;border-radius:11px}
.metric b{display:block;color:var(--cyan);font-size:18px}
.metric small{color:var(--muted)}
#steps{max-height:180px;overflow:auto;padding-right:22px;font-size:13px;line-height:1.9}
.bottom{position:absolute;z-index:5;bottom:10px;right:10px;left:10px;padding:9px;display:flex;gap:7px}
.bottom button{flex:1;background:#17283c;color:white;border-radius:12px;padding:12px 5px;font-weight:700}
.bottom .alert{background:#382b21;color:#ffd28b}
.bottom .clear{background:#34232b;color:#ffb3bd}
#notice{position:absolute;z-index:10;top:75px;left:50%;transform:translateX(-50%);background:#091522f5;border:1px solid #ffffff20;border-radius:12px;padding:11px 15px;display:none;max-width:90%;font-size:13px}
#notice.show{display:block}
#reports{position:absolute;z-index:6;bottom:75px;left:10px;width:min(280px,calc(100% - 20px));padding:13px;display:none}
#reports.show{display:block}
#reports h3{margin:0 0 10px}
.reportgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.reportgrid button{background:#17283c;color:white;padding:11px;border-radius:10px}
#loading{position:absolute;z-index:9;inset:0;display:grid;place-items:center;background:#e8eef1;color:#0b1c2c;text-align:center;padding:20px}
#loading.hide{display:none}
.loadingbox{background:white;border-radius:17px;padding:20px;box-shadow:0 5px 25px #0002}
@media(max-width:600px){
 .top{flex-wrap:wrap}
 .brand{min-width:0;flex:1}
 .search{order:3;flex-basis:100%}
 .tools{top:125px}
 .status{top:125px;right:61px}
 .route{top:175px}
 .bottom{gap:5px}
 .bottom button{font-size:11px;padding:10px 3px}
}
</style>
</head>
<body>
<div id="app">
 <div id="map"></div>
 <div id="loading"><div class="loadingbox"><b>درب العراق</b><p id="loadmsg">جاري تحميل الخريطة...</p></div></div>

 <div class="panel top">
  <div class="brand"><div class="logo">➤</div><div><b>درب العراق</b><small>DARB AL-IRAQ</small></div></div>
  <div class="search">
   <input id="query" placeholder="ابحث عن أي مكان بالعالم...">
   <button class="btn" id="search">بحث</button>
  </div>
 </div>

 <div class="panel status" id="status">● الخريطة جاهزة</div>

 <div class="tools">
  <button class="iconbtn" id="loc" title="موقعي">◎</button>
  <button class="iconbtn" id="plus">＋</button>
  <button class="iconbtn" id="minus">－</button>
  <button class="iconbtn" id="tilt">◇</button>
  <button class="iconbtn" id="dark">◐</button>
 </div>

 <div class="panel route" id="route">
  <h3 id="routeTitle">المسار إلى الوجهة</h3>
  <div class="metrics">
   <div class="metric"><b id="distance">--</b><small>المسافة</small></div>
   <div class="metric"><b id="duration">--</b><small>الوقت التقريبي</small></div>
  </div>
  <button class="btn" style="width:100%;margin-top:10px" id="start">ابدأ الملاحة</button>
  <ol id="steps"></ol>
  <small style="color:#a4b5c8">لا تتوفر بيانات الزحمة المباشرة.</small>
 </div>

 <div class="panel" id="reports">
  <h3>اختار نوع البلاغ</h3>
  <div class="reportgrid">
   <button data-type="🚗 زحمة">🚗 زحمة</button>
   <button data-type="⚠️ خطر">⚠️ خطر بالطريق</button>
   <button data-type="🕳️ حفرة">🕳️ حفرة</button>
   <button data-type="🚓 سيطرة">🚓 سيطرة / شرطة</button>
   <button data-type="📷 كاميرا">📷 كاميرا سرعة</button>
   <button data-type="⛔ إغلاق">⛔ طريق مغلق</button>
  </div>
  <p style="font-size:11px;color:#a4b5c8">البلاغات محفوظة على هذا الجهاز فقط.</p>
 </div>

 <div class="panel bottom">
  <button class="alert" id="reportBtn">⚠️ بلاغ</button>
  <button id="trafficBtn">🚗 الزحمة</button>
  <button class="clear" id="clear">✕ مسح المسار</button>
 </div>
 <div id="notice"></div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const $=id=>document.getElementById(id);
let map,position=null,destination=null,destMarker=null,userMarker=null,routeData=null;
let dark=false,tilted=false,reportMode=false,nav=false,watch=null;
let reports=[];
try{reports=JSON.parse(localStorage.getItem('darb_reports')||'[]')}catch(e){reports=[]}

function say(text){
 const n=$('notice');n.textContent=text;n.classList.add('show');
 clearTimeout(window.noticeTimer);
 window.noticeTimer=setTimeout(()=>n.classList.remove('show'),3500);
}
function status(text){$('status').textContent='● '+text}
function clearRoute(){
 destination=null;routeData=null;nav=false;
 if(destMarker){destMarker.remove();destMarker=null}
 if(map&&map.getSource('route'))map.getSource('route').setData({type:'FeatureCollection',features:[]});
 $('route').classList.remove('show');$('steps').innerHTML='';
 $('start').textContent='ابدأ الملاحة';status('الخريطة جاهزة');
}
function arrow(){
 const el=document.createElement('div');
 el.innerHTML='<svg width="34" height="38" viewBox="0 0 34 38"><path d="M17 2 L31 34 L17 27 L3 34 Z" fill="#2478ff" stroke="white" stroke-width="3" stroke-linejoin="round"/></svg>';
 return el;
}
function setPosition(lon,lat,fly=true){
 position=[lon,lat];
 if(!userMarker)userMarker=new maplibregl.Marker({element:arrow(),rotationAlignment:'map'}).setLngLat(position).addTo(map);
 else userMarker.setLngLat(position);
 if(fly)map.flyTo({center:position,zoom:16,duration:900});
 status('تم تحديد موقعك');
 if(destination)getRoute();
}
function locate(){
 if(!navigator.geolocation){say('المتصفح لا يدعم تحديد الموقع.');return}
 status('جاري تحديد موقعك...');
 navigator.geolocation.getCurrentPosition(p=>{
  setPosition(p.coords.longitude,p.coords.latitude,true);
 },e=>{
  status('الخريطة جاهزة');
  say(e.code===1?'اسمح للمتصفح باستخدام موقعك.':'تعذر تحديد موقعك. فعّل GPS وحاول مجدداً.');
 },{enableHighAccuracy:true,timeout:15000,maximumAge:5000});
}
async function searchPlace(){
 const q=$('query').value.trim();
 if(!q){say('اكتب اسم المكان أولاً.');return}
 status('جاري البحث...');
 try{
  const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&accept-language=ar,en&q='+encodeURIComponent(q);
  const res=await fetch(url);
  if(!res.ok)throw Error('search');
  const results=await res.json();
  if(!results.length){say('ما لقينا المكان، جرّب اسم أوضح.');status('الخريطة جاهزة');return}
  const r=results[0],lon=+r.lon,lat=+r.lat;
  destination=[lon,lat];
  if(destMarker)destMarker.remove();
  const el=document.createElement('div');
  el.style.cssText='width:23px;height:23px;border:4px solid white;border-radius:50%;background:#ff5264;box-shadow:0 2px 8px #0006';
  destMarker=new maplibregl.Marker({element:el}).setLngLat(destination).setPopup(new maplibregl.Popup().setText(r.display_name)).addTo(map);
  map.flyTo({center:destination,zoom:14,duration:1000});
  $('routeTitle').textContent=r.name||'الوجهة المحددة';
  $('route').classList.add('show');
  if(position)await getRoute();
  else{$('distance').textContent='--';$('duration').textContent='حدد موقعك';$('steps').innerHTML='<li>اضغط زر الموقع لتحديد نقطة الانطلاق.</li>';say('حدد موقعك حتى نحسب المسار.')}
  status('تم العثور على الوجهة');
 }catch(e){console.error(e);say('تعذر البحث. تحقق من الإنترنت.');status('الخريطة جاهزة')}
}
function describeStep(s){
 const m=s.maneuver||{},type=m.type||'continue',mod=m.modifier||'';
 let text='واصل السير';
 if(type==='turn')text='انعطف '+(mod.includes('left')?'يساراً':mod.includes('right')?'يميناً':'');
 else if(type==='depart')text='انطلق';
 else if(type==='arrive')text='وصلت إلى الوجهة';
 else if(type==='roundabout')text='ادخل الدوار';
 else if(type==='merge')text='اندماج مع الطريق';
 if(s.name)text+=' باتجاه '+s.name;
 if(s.distance>30)text+=' لمسافة '+(s.distance>1000?(s.distance/1000).toFixed(1)+' كم':Math.round(s.distance)+' م');
 return text;
}
async function getRoute(){
 if(!position||!destination)return;
 status('جاري حساب المسار...');
 try{
  const coords=position.join(',')+';'+destination.join(',');
  const res=await fetch('https://router.project-osrm.org/route/v1/driving/'+coords+'?overview=full&geometries=geojson&steps=true');
  const data=await res.json();
  if(data.code!=='Ok'||!data.routes.length)throw Error('no route');
  routeData=data.routes[0];
  map.getSource('route').setData({type:'Feature',properties:{},geometry:routeData.geometry});
  const bounds=new maplibregl.LngLatBounds();
  routeData.geometry.coordinates.forEach(c=>bounds.extend(c));
  map.fitBounds(bounds,{padding:{top:130,bottom:130,left:40,right:40},duration:800,maxZoom:16});
  $('distance').textContent=routeData.distance>=1000?(routeData.distance/1000).toFixed(1)+' كم':Math.round(routeData.distance)+' م';
  let min=Math.max(1,Math.round(routeData.duration/60));
  $('duration').textContent=min>=60?Math.floor(min/60)+' س '+min%60+' د':min+' د';
  $('steps').innerHTML='';
  (routeData.legs||[]).flatMap(l=>l.steps||[]).slice(0,15).forEach(s=>{
   const li=document.createElement('li');li.textContent=describeStep(s);$('steps').appendChild(li);
  });
  $('route').classList.add('show');
  status('تم حساب المسار');
  say('تم رسم المسار. الوقت تقديري ولا يتضمن الزحمة المباشرة.');
 }catch(e){console.error(e);say('تعذر حساب طريق قيادة لهذه الوجهة.');status('تعذر حساب الطريق')}
}
function drawReports(){
 document.querySelectorAll('.user-report-marker').forEach(e=>e.remove());
 reports.forEach(r=>{
  const el=document.createElement('div');el.className='user-report-marker';
  el.textContent=r.type.split(' ')[0];el.style.cssText='font-size:25px;cursor:pointer;filter:drop-shadow(0 2px 3px #0005)';
  new maplibregl.Marker({element:el}).setLngLat([r.lon,r.lat]).setPopup(new maplibregl.Popup().setText(r.type+' · بلاغ محلي تجريبي')).addTo(map);
 });
}
function addLayers(){
 if(map.getSource('route'))return;
 map.addSource('route',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
 map.addLayer({id:'route-outline',type:'line',source:'route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#fff','line-width':12}});
 map.addLayer({id:'route-line',type:'line',source:'route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#2478ff','line-width':7}});
}
function init(){
 if(!window.maplibregl){$('loadmsg').textContent='تعذر تحميل مكتبة الخرائط. تأكد من الإنترنت.';return}
 map=new maplibregl.Map({
  container:'map',
  style:'https://tiles.openfreemap.org/styles/bright',
  center:[44.3661,33.3152],zoom:12,pitch:0,bearing:0,
  attributionControl:true
 });
 map.addControl(new maplibregl.NavigationControl({showZoom:false,showCompass:false}),'bottom-right');
 map.on('load',()=>{
  addLayers();$('loading').classList.add('hide');drawReports();
  map.on('click',e=>{
   if(!reportMode)return;
   const type=window.reportType||'⚠️ خطر';
   reports.push({type,lon:e.lngLat.lng,lat:e.lngLat.lat,time:Date.now()});
   reports=reports.slice(-100);
   try{localStorage.setItem('darb_reports',JSON.stringify(reports))}catch(err){}
   reportMode=false;$('reports').classList.remove('show');drawReports();
   say('تم حفظ البلاغ على هذا الجهاز فقط.');
  });
 });
 map.on('error',e=>{console.log('Map error',e.error);if(!$('loading').classList.contains('hide'))$('loadmsg').textContent='تعذر تحميل الخريطة. جرّب تحديث الصفحة أو شبكة أخرى.'});
}
$('search').onclick=searchPlace;
$('query').addEventListener('keydown',e=>{if(e.key==='Enter')searchPlace()});
$('loc').onclick=locate;
$('plus').onclick=()=>map&&map.zoomIn();
$('minus').onclick=()=>map&&map.zoomOut();
$('tilt').onclick=()=>{if(!map)return;tilted=!tilted;map.easeTo({pitch:tilted?50:0,bearing:tilted?-12:0,duration:700})};
$('dark').onclick=()=>{
 if(!map)return;dark=!dark;
 map.setStyle(dark?'https://tiles.openfreemap.org/styles/dark':'https://tiles.openfreemap.org/styles/bright');
 map.once('style.load',()=>{addLayers();if(routeData)map.getSource('route').setData({type:'Feature',properties:{},geometry:routeData.geometry});drawReports()});
};
$('clear').onclick=clearRoute;
$('reportBtn').onclick=()=>$('reports').classList.toggle('show');
$('trafficBtn').onclick=()=>say('الزحمة المباشرة غير متوفرة بعد. البلاغات محلية على جهازك.');
document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{
 window.reportType=b.dataset.type;reportMode=true;$('reports').classList.remove('show');say('اضغط على مكان البلاغ بالخريطة.');
});
$('start').onclick=()=>{
 if(!routeData){say('حدد موقعك والوجهة أولاً.');return}
 nav=!nav;$('start').textContent=nav?'إيقاف الملاحة':'ابدأ الملاحة';
 if(nav&&navigator.geolocation){
  watch=navigator.geolocation.watchPosition(p=>{
   setPosition(p.coords.longitude,p.coords.latitude,false);
   if(nav)map.easeTo({center:[p.coords.longitude,p.coords.latitude],zoom:16,duration:500});
  },()=>{}, {enableHighAccuracy:true,maximumAge:3000,timeout:10000});
  say('بدأ تتبع موقعك. اتبع التعليمات المعروضة.');
 }else if(watch!==null){navigator.geolocation.clearWatch(watch);watch=null;say('تم إيقاف الملاحة.')}
};
init();
</script>
</body>
</html>
