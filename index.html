<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>

body{font:15px/1.65 'Sora','IBM Plex Sans Arabic',system-ui,sans-serif;background:radial-gradient(900px 500px at 70% -10%,rgba(139,92,246,.2),transparent),radial-gradient(700px 400px at 0 100%,rgba(79,140,255,.15),transparent),var(--bg);color:var(--tx);height:100dvh;display:flex;overflow:hidden}

button{cursor:pointer;background:none;border:0}

aside{width:280px;flex:none;display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--gl);backdrop-filter:blur(18px);border-inline-end:1px solid var(--bd);transition:margin .25s;z-index:20}
aside.hide{margin-inline-start:-280px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.14em}
.brand svg{width:28px;height:28px}
.btn{padding:9px 14px;border-radius:12px;border:1px solid var(--bd);background:rgba(120,140,255,.08);transition:.15s}
.btn:hover{background:rgba(120,140,255,.18)}
.pri{background:var(--g);border:0;color:#fff;font-weight:600}
.pri:hover{filter:brightness(1.1);background:var(--g)}
input,select,textarea{background:rgba(120,140,255,.07);border:1px solid var(--bd);border-radius:10px;padding:8px 11px;width:100%}
select option{background:var(--bg2)}
nav{display:grid;gap:2px}
nav button,.ci{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;text-align:start;color:var(--mu)}
nav button:hover,nav button.on,.ci:hover,.ci.on{background:rgba(120,140,255,.14);color:var(--tx)}
#list{flex:1;overflow:auto;display:grid;align-content:start;gap:2px}
.ci{cursor:pointer;font-size:13.5px}.ci .ct{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ci small{font-size:11px;opacity:.6}
.ci button{display:none;padding:0 4px;color:var(--mu)}.ci:hover button{display:block}
.me{display:flex;align-items:center;gap:10px;padding-top:10px;border-top:1px solid var(--bd)}
.avt{width:32px;height:32px;border-radius:50%;background:var(--g);display:grid;place-items:center;font-weight:600;color:#fff;flex:none}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--bd)}
.top select{width:auto;max-width:60vw}
.view{display:none;flex:1;min-height:0;flex-direction:column}.view.on{display:flex}
#msgs{flex:1;overflow:auto;padding:20px 16px}
.wrap{max-width:820px;margin:0 auto}
.m{display:flex;gap:12px;margin-bottom:22px}
.av{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;background:rgba(120,140,255,.18);font-size:13px;font-weight:600}
.av svg{width:20px;height:20px}
.mb{flex:1;min-width:0}.meta{font-size:12px;color:var(--mu);margin-bottom:2px}
.m.u .body{background:rgba(79,140,255,.13);border:1px solid var(--bd);border-radius:14px;padding:8px 13px;display:inline-block;max-width:100%;overflow-wrap:anywhere}
.body p{margin:.5em 0}.body ul,.body ol{padding-inline-start:1.4em;margin:.5em 0}.body h1,.body h2,.body h3{margin:.8em 0 .3em;font-size:1.1em}
.body a{color:var(--b)}.body code{background:rgba(120,140,255,.16);padding:1px 5px;border-radius:5px;font-size:.9em}
.code{border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin:.7em 0;background:var(--cb);direction:ltr;text-align:left}
.ch{display:flex;justify-content:space-between;padding:5px 12px;font-size:12px;color:var(--mu);border-bottom:1px solid var(--bd)}
.code pre{padding:12px;overflow:auto;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}.code code{background:none;padding:0}
.code i{font-style:normal}.c{color:#6b7599}.s{color:#7ee0a8}.k{color:#b392ff}.n{color:#ffb86b}
.acts{display:flex;gap:4px;margin-top:4px;opacity:.55}.acts button{font-size:12px;padding:2px 8px;border-radius:8px;color:var(--mu)}.acts button:hover{background:rgba(120,140,255,.16);color:var(--tx)}
.err{margin-top:6px;padding:8px 12px;border-radius:10px;background:rgba(255,80,100,.12);border:1px solid rgba(255,80,100,.4);font-size:13px}
.err button{margin-inline-start:8px;text-decoration:underline}
.dots{display:inline-flex;gap:4px;padding:8px 0}.dots i{width:7px;height:7px;border-radius:50%;background:var(--b);animation:bl 1.1s infinite}.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}

.eclipse{width:132px;height:132px;margin:0 auto 18px;position:relative}
.eclipse:before{content:"";position:absolute;inset:-26px;border-radius:50%;background:conic-gradient(from 0deg,#4f8cff,#8b5cf6,#4f8cff);filter:blur(24px);opacity:.55;animation:sp 9s linear infinite}

.comp{padding:10px 16px 16px}

.bar{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;align-items:center}.bar .on{background:var(--g);color:#fff}

.dlg{width:min(620px,100%);max-height:90dvh;overflow:auto;padding:20px;border-radius:18px;background:var(--bg2);border:1px solid var(--bd);display:grid;gap:10px}
fieldset{border:1px solid var(--bd);border-radius:12px;padding:10px;display:grid;gap:6px}legend{padding:0 6px;font-size:13px;color:var(--mu)}
label{font-size:13px;color:var(--mu)}.note{font-size:12.5px;color:var(--mu);padding:10px;border-radius:10px;background:rgba(255,184,107,.1);border:1px solid rgba(255,184,107,.35)}
#ov{display:none}
@media(max-width:820px){aside{position:fixed;inset-block:0;inset-inline-start:0}#ov.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:15}.ws{grid-template-columns:1fr;overflow:auto}.ws>*{min-height:300px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* markdown + highlighting */

if(bin.some(a=>a.kind==='pdf'))throw Error('PDF analysis needs Anthropic or Gemini. Choose one of those models.');
return[{type:'text',text:txt},...bin.map(a=>({type:'image_url',image_url:{url:`data:${a.type};base64,${a.data}`}}))]}
async function call(p,h,sys,sig,out){const c=S.p.prov[p],k=K[p];let r;const J={'content-type':'application/json'};
if(p==='anthropic'){r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:sig,headers:{...J,'x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:c.model,max_tokens:4096,system:sys,stream:true,messages:h.map(m=>({role:m.role,content:m.role==='user'?m.parts:m.text}))})});await ok(r);await sse(r,j=>{if(j.type==='content_block_delta'&&j.delta.text)out(j.delta.text);if(j.type==='error')throw Error(j.error.message)})}
else if(p==='gemini'){r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(c.model)}:streamGenerateContent?alt=sse`,{method:'POST',signal:sig,headers:{...J,'x-goog-api-key':k},body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:h.map(m=>({role:m.role==='user'?'user':'model',parts:m.role==='user'?m.parts:[{text:m.text}]}))})});await ok(r);await sse(r,j=>(j.candidates?.[0]?.content?.parts||[]).forEach(x=>x.text&&out(x.text)))}
else{const hd={...J};if(k)hd.authorization='Bearer '+k;r=await fetch((c.base||'').replace(/\/$/,'')+'/chat/completions',{method:'POST',signal:sig,headers:hd,body:JSON.stringify({model:c.model,stream:true,messages:[{role:'system',content:sys},...h.map(m=>({role:m.role,content:m.role==='user'?m.parts:m.text}))]})});await ok(r);await sse(r,j=>{const d=j.choices?.[0]?.delta?.content;if(d)out(d);if(j.error)throw Error(j.error.message)})}}
function system(c){let s='You are ECLIPSE AI, a capable assistant. Reply in the language the user writes in.';s+={concise:' Keep answers short.',detailed:' Give thorough, well-structured answers.',balanced:''}[S.p.fmt];if(S.p.instr)s+='\nUser instructions: '+S.p.instr;if(S.p.mem.trim())s+='\nNotes about the user:\n'+S.p.mem;const tl=TL.find(x=>x[0]===c.tool);if(tl)s+='\n'+tl[3];return s}

/* chat */
function newChat(tool){const c={id:'c'+Date.now(),title:'',msgs:[],tool:tool||null,upd:Date.now()};S.convs.push(c);S.cur=c.id;save();renderList();renderMsgs();return c}
function busy(f){busyF=f;$('#go').textContent=f?'■':'➤';$('#go').setAttribute('aria-label',f?'Stop':'Send')}
async function gen(){const c=cur(),p=curProv();if(!p){openSettings();return}
const a={role:'assistant',text:'',ts:Date.now(),model:PV[p].n+' · '+S.p.prov[p].model};c.msgs.push(a);busy(true);stick=true;renderMsgs();ac=new AbortController();
try{let sys=system(c);
if(S.p.web){if(!K.tavily)throw Error(t('nosearch'));const q=[...c.msgs].reverse().find(m=>m.role==='user').text;const r=await fetch('https://api.tavily.com/search',{method:'POST',signal:ac.signal,headers:{'content-type':'application/json',authorization:'Bearer '+K.tavily},body:JSON.stringify({query:q,max_results:5})});await ok(r);const j=await r.json();sys+='\nWeb search results (cite URLs when used):\n'+(j.results||[]).map(x=>`- ${x.title} (${x.url}): ${(x.content||'').slice(0,400)}`).join('\n')}
const h=c.msgs.slice(0,-1).filter(m=>m.text||m.role==='user').map(m=>({role:m.role,text:m.text,parts:m.role==='user'?parts(p,m):null}));
await call(p,h,sys,ac.signal,d=>{a.text+=d;upd(a)})}
catch(e){if(e.name!=='AbortError')a.err=(e instanceof TypeError?'Network/CORS error: the provider may block direct browser calls or the URL is wrong. ':'')+(e.message||e)}
busy(false);ac=null;if(!a.text&&!a.err)c.msgs.pop();c.upd=Date.now();save();renderMsgs();renderList()}
function send(txt){const inp=$('#in');txt=(txt??inp.value).trim();if(busyF||(!txt&&!pend.length))return;if(!curProv()){openSettings();return}
let c=cur()||newChat();c.msgs.push({role:'user',text:txt||'(attachment)',ts:Date.now(),att:pend.splice(0)});if(!c.title)c.title=(txt||'Attachment').slice(0,40);inp.value='';grow();chips();setView('chat');gen()}
function msgHTML(m,i,last){const u=m.role==='user';const at=(m.att||[]).map(a=>`<span>📎 ${esc(a.name)}</span>`).join(' ');
const body=u?esc(m.text).replace(/\n/g,'<br>')+(at?'<div style="font-size:12px;margin-top:4px">'+at+'</div>':''):(m.text?md(m.text):(m.err?'':'<span class=dots><i></i><i></i><i></i></span>'));
return `<div class="m ${u?'u':'a'}" data-i="${i}"><div class=av>${u?esc((S.p.name||'U')[0].toUpperCase()):LOGO}</div><div class=mb><div class=meta>${u?t('you'):'Eclipse'} · ${fmtT(m.ts)}${m.model?' · '+esc(m.model):''}</div><div class=body>${body}</div>${m.err?`<div class=err>${esc(m.err)}<button data-act=retry>${t('retry')}</button></div>`:''}<div class=acts>${u?`<button data-act=edit>${t('edit')}</button>`:`<button data-act=copy>${t('copy')}</button>${last?`<button data-act=regen>${t('regen')}</button>`:''}`}</div></div></div>`}
function renderMsgs(){const c=cur();const w=$('#mw');if(!c||!c.msgs.length){const np=!curProv();w.innerHTML=`<div class=empty><div class=eclipse></div><h1>${t('title')}</h1><p>${t('sub')}</p>${np?`<div class=setup>${t('setup')}</div>`:''}<div class=sug>${L[S.p.lang].sp.map(x=>`<button data-sug="${escA(x)}">${esc(x)}</button>`).join('')}</div></div>`;return}
w.innerHTML=c.msgs.map((m,i)=>msgHTML(m,i,i===c.msgs.length-1)).join('');scroll()}
function upd(a){const el=$('#mw .m.a:last-child .body');if(el)el.innerHTML=md(a.text);scroll()}
function scroll(){const m=$('#msgs');if(stick)m.scrollTop=m.scrollHeight}
$('#msgs').addEventListener('scroll',e=>{const m=e.target;stick=m.scrollHeight-m.scrollTop-m.clientHeight<80});
$('#mw').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.sug){send(b.dataset.sug);return}
if(b.hasAttribute('data-copy')){navigator.clipboard.writeText(b.closest('.code').querySelector('pre').innerText);b.textContent=t('copied');setTimeout(()=>b.textContent=t('copy'),1200);return}
const c=cur(),el=b.closest('.m');if(!el||!b.dataset.act)return;const i=+el.dataset.i,m=c.msgs[i],a=b.dataset.act;
if(a==='copy'){navigator.clipboard.writeText(m.text);b.textContent=t('copied')}
if((a==='regen'||a==='retry')&&!busyF){c.msgs.splice(i);gen()}
if(a==='edit'&&!busyF){const bd=el.querySelector('.body');bd.innerHTML=`<textarea rows=3>${esc(m.text)}</textarea><div class=acts style="opacity:1"><button data-act=save>${t('save')}</button><button data-act=cancel>${t('cancel')}</button></div>`}
if(a==='cancel')renderMsgs();
if(a==='save'){const v=el.querySelector('textarea').value.trim();if(!v)return;m.text=v;c.msgs.splice(i+1);save();gen()}});

/* attachments */
function chips(){$('#chips').innerHTML=pend.map((a,i)=>`<span>${esc(a.name)} <button data-x="${i}">✕</button></span>`).join('')}
$('#chips').onclick=e=>{const x=e.target.dataset.x;if(x!=null){pend.splice(+x,1);chips()}};
$('#att').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{for(const f of e.target.files){const o={name:f.name,type:f.type};if(f.type.startsWith('image/')||f.type==='application/pdf'){o.kind=f.type==='application/pdf'?'pdf':'img';o.data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.readAsDataURL(f)})}else{o.kind='text';o.data=(await f.text()).slice(0,60000)}pend.push(o)}e.target.value='';chips()};
$('#web').onclick=()=>{if(!S.p.web&&!K.tavily){alert(t('nosearch'));openSettings();return}S.p.web=!S.p.web;$('#web').classList.toggle('on',S.p.web);save()};

/* sidebar */
function renderList(){const q=$('#q').value.toLowerCase();$('#list').innerHTML=[...S.convs].filter(c=>!q||(c.title+' '+c.msgs.map(m=>m.text).join(' ')).toLowerCase().includes(q)).sort((a,b)=>b.upd-a.upd).map(c=>`<div class="ci ${c.id===S.cur?'on':''}" data-id="${c.id}"><span class=ct>${esc(c.title||t('newt'))}</span><button data-r aria-label="${t('ren')}">✎</button><button data-d aria-label="Delete">✕</button></div>`).join('')}
$('#list').onclick=e=>{const ci=e.target.closest('.ci');if(!ci)return;const c=S.convs.find(x=>x.id===ci.dataset.id);
if(e.target.hasAttribute('data-r')){const n=prompt(t('ren'),c.title);if(n!=null){c.title=n.trim()||c.title;save();renderList()}return}
if(e.target.hasAttribute('data-d')){if(confirm(t('del'))){S.convs=S.convs.filter(x=>x!==c);if(S.cur===c.id)S.cur=null;save();renderList();renderMsgs()}return}
S.cur=c.id;save();setView('chat');renderList();renderMsgs();closeSide()};
$('#q').oninput=renderList;
$('#nc').onclick=()=>{newChat();setView('chat');closeSide();$('#in').focus()};
const side=$('#side'),mob=()=>innerWidth<=820;
function closeSide(){if(mob()){side.classList.add('hide');$('#ov').classList.remove('on')}}
$('#tg').onclick=()=>{side.classList.toggle('hide');$('#ov').classList.toggle('on',mob()&&!side.classList.contains('hide'))};
$('#ov').onclick=closeSide;
function setView(v){$$('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));$$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));if(v==='code')loadEd();closeSide()}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)setView(b.dataset.v)};

/* tools */
function renderTools(){$('#tgrid').innerHTML=TL.map(x=>`<button class=card data-t="${x[0]}"><b>${S.p.lang==='ar'?x[2]:x[1]}</b></button>`).join('')}
$('#tgrid').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;const x=TL.find(y=>y[0]===b.dataset.t);newChat(x[0]);setView('chat');$('#in').value=x[4];$('#in').focus();grow()};

/* coding workspace */
const FN={html:'index.html',css:'style.css',js:'script.js',py:'main.py'};
function loadEd(){$('#ctabs').innerHTML=Object.keys(FN).map(k=>`<button class="btn ${k===tab?'on':''}" data-k="${k}">${FN[k]}</button>`).join('')+'<span style="color:var(--mu);font-size:12px">'+(tab==='py'?t('pyn'):'')+'</span>';$('#ed').value=S.p.code[tab];$('#cbar').innerHTML=[['run',t('run')],['copy',t('copy')],['dl',t('dl')],['clr',t('clr')],['exp',t('exp')],['dbg',t('dbg')]].map(x=>`<button class=btn data-a="${x[0]}">${x[1]}</button>`).join('');preview()}
function preview(){const c=S.p.code;$('#pv').srcdoc=`<!doctype html><meta charset=utf-8><style>${c.css}</style>${c.html}<script>${c.js}<\/script>`}
$('#ed').oninput=e=>{S.p.code[tab]=e.target.value;save()};
$('#ctabs').onclick=e=>{const k=e.target.dataset.k;if(k){tab=k;loadEd()}};
$('#cbar').onclick=e=>{const a=e.target.dataset.a;if(!a)return;const code=S.p.code[tab];
if(a==='run')preview();
if(a==='copy')navigator.clipboard.writeText(code);
if(a==='dl'){const u=URL.createObjectURL(new Blob([code],{type:'text/plain'})),l=document.createElement('a');l.href=u;l.download=FN[tab];l.click();URL.revokeObjectURL(u)}
if(a==='clr'){S.p.code[tab]='';save();loadEd()}
if(a==='exp'||a==='dbg'){if(!code.trim())return;newChat('code');setView('chat');send((a==='exp'?'Explain this '+tab+' code step by step:':'Find and fix bugs in this '+tab+' code, and explain each fix:')+'\n```'+tab+'\n'+code+'\n```')}};

/* images */
$('#ig').onclick=async()=>{const o=$('#io'),p=S.p.prov.openai,pr=$('#ip').value.trim();if(!pr)return;if(!K.openai||!S.p.imgModel||!p.base){o.textContent=t('noimg');return}
o.textContent='…';try{const r=await fetch(p.base.replace(/\/$/,'')+'/images/generations',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+K.openai},body:JSON.stringify({model:S.p.imgModel,prompt:pr,size:$('#isz').value,n:1})});await ok(r);const j=(await r.json()).data[0];const src=j.url||'data:image/png;base64,'+j.b64_json;o.innerHTML=`<img src="${escA(src)}" style="max-width:100%;border-radius:14px" alt="">`}catch(e){o.textContent=e.message}};

/* settings */
function openSettings(){const p=S.p;const sel=(k,opts)=>`<select data-p="${k}">${opts.map(o=>`<option value="${o[0]}" ${p[k]===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`;
$('#dlg').innerHTML=`<h2>${t('settings')}</h2><div class=note>${t('sec')}</div>
${Object.keys(PV).map(id=>`<fieldset><legend>${PV[id].n}${ready(id)?' ✓':''}</legend><input type=password data-k="${id}" autocomplete=off placeholder="${K[id]?'•••••• (set this session)':'API key'}"><input data-m="${id}" placeholder="Model id, e.g. ${PV[id].ph}" value="${escA(p.prov[id].model)}">${p.prov[id].base!==undefined?`<input data-b="${id}" placeholder="Base URL" value="${escA(p.prov[id].base)}">`:''}</fieldset>`).join('')}
<fieldset><legend>Tools</legend><input type=password data-k="tavily" autocomplete=off placeholder="Tavily API key (web search)"><input data-p="imgModel" placeholder="${t('imgm')} (uses OpenAI key/base URL)" value="${escA(p.imgModel)}"></fieldset>
<label>${t('name')}</label><input data-p="name" value="${escA(p.name)}">
<label>${t('theme')}</label>${sel('theme',[['dark','Dark'],['light','Light']])}
<label>${t('lang')}</label>${sel('lang',[['en','English'],['ar','العربية']])}
<label>${t('fmt')}</label>${sel('fmt',[['concise','Concise'],['balanced','Balanced'],['detailed','Detailed']])}
<label>${t('instr')}</label><textarea rows=3 data-p="instr">${esc(p.instr)}</textarea>
<label>${t('mem')}</label><textarea rows=3 data-p="mem">${esc(p.mem)}</textarea>
<div style="display:flex;gap:8px;flex-wrap:wrap"><button class=btn id="ex">${t('exportb')}</button><button class=btn id="wp">${t('wipe')}</button><span style="flex:1"></span><button class="btn pri" id="cl">${t('close')}</button></div>`;
$('#modal').classList.add('on')}
const dlg=$('#dlg');
dlg.addEventListener('input',e=>{const el=e.target,d=el.dataset;if(d.k&&el.value)K[d.k]=el.value.trim();else if(d.m)S.p.prov[d.m].model=el.value.trim();else if(d.b)S.p.prov[d.b].base=el.value.trim();else if(d.p)S.p[d.p]=el.value;save();models()});
dlg.addEventListener('change',e=>{if(e.target.dataset.p==='theme'||e.target.dataset.p==='lang'){prefs();openSettings()}});
dlg.addEventListener('click',e=>{const i=e.target.id;if(i==='cl')closeSet();
if(i==='ex'){const u=URL.createObjectURL(new Blob([JSON.stringify({conversations:S.convs,preferences:{...S.p}},null,2)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='eclipse-export.json';l.click();URL.revokeObjectURL(u)}
if(i==='wp'&&confirm(t('del'))){S.convs=[];S.cur=null;save();renderList();renderMsgs()}});
function closeSet(){$('#modal').classList.remove('on');prefs();renderMsgs()}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeSet()};
$('#setb').onclick=openSettings;

/* prefs, models, input */
function models(){const r=Object.keys(PV).filter(ready),m=$('#model');m.innerHTML=r.length?r.map(id=>`<option value="${id}" ${id===curProv()?'selected':''}>${PV[id].n} · ${esc(S.p.prov[id].model)}</option>`).join(''):`<option>${t('nop')}</option>`}
$('#model').onchange=e=>{if(ready(e.target.value)){S.p.sel=e.target.value;save()}};
function prefs(){const p=S.p,h=document.documentElement;h.dataset.theme=p.theme;h.lang=p.lang;h.dir=p.lang==='ar'?'rtl':'ltr';
$('#nc').textContent='＋ '+t('new');$('#q').placeholder=t('search');$('#in').placeholder=t('ph');$('#ip').placeholder=t('iph');$('#ig').textContent=t('gen');
$('#nav').innerHTML=[['chat',t('chat')],['tools',t('tools')],['code',t('code')],['img',t('images')]].map(x=>`<button data-v="${x[0]}">${x[1]}</button>`).join('');
$$('#nav button').forEach(b=>b.classList.toggle('on',$('#v-'+b.dataset.v).classList.contains('on')));
$('#uname').textContent=p.name||'User';$('#avt').textContent=(p.name||'U')[0].toUpperCase();$('#web').classList.toggle('on',p.web);
renderTools();renderList();models();save()}
function grow(){const i=$('#in');i.style.height='auto';i.style.height=Math.min(i.scrollHeight,200)+'px'}
$('#in').oninput=grow;
$('#in').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}};
$('#go').onclick=()=>busyF?ac&&ac.abort():send();
document.addEventListener('keydown',e=>{const m=e.ctrlKey||e.metaKey;if(m&&e.key==='k'){e.preventDefault();$('#nc').click()}if(m&&e.key==='b'){e.preventDefault();$('#tg').click()}if(m&&e.key===','){e.preventDefault();openSettings()}if(e.key==='Escape'){if($('#modal').classList.contains('on'))closeSet();else if(busyF&&ac)ac.abort()}});
$('#logo1').innerHTML=LOGO;if(mob())side.classList.add('hide');
if(!cur())S.cur=null;prefs();renderMsgs();
</script></body></html>
